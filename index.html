<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Ratio Memory Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            margin: auto;
        }

        .digit-display {
            font-family: monospace;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 36px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            max-width: 500px;
            line-height: 1.8;
            gap: 2px;
        }

        .input-wrapper {
            margin: 20px 0;
        }

        #digit-input {
            width: 80px;
            height: 80px;
            font-size: 48px;
            text-align: center;
            border: 3px solid #3498db;
            border-radius: 12px;
            caret-color: transparent;
            background-color: white;
        }

        #digit-input:focus {
            outline: none;
            border-color: #2980b9;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
        }

        .score {
            font-size: 24px;
            margin: 20px 0;
            color: #333;
            font-weight: bold;
        }

        .timer-bar {
            width: 250px;
            height: 12px;
            background-color: #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 10px;
        }

        #timer-progress {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71);
            border-radius: 6px;
            transition: width 0.03s linear;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="digit-display" id="digit-display"></div>
        <div class="input-wrapper">
            <input type="text" id="digit-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus>
        </div>
        <div class="score">Score: <span id="score">0</span></div>
        <div class="timer-bar">
            <div id="timer-progress"></div>
        </div>
    </div>
    
    <script src="phi.js"></script>
    <script>
        let currentIndex = 0;
        let score = 0;
        let timerInterval;
        let enteredDigits = [];
        let gameActive = true;

        // Initialize game when DOM is ready
        function init() {
            const input = document.getElementById('digit-input');
            input.addEventListener('input', handleInput);
            startGame();
        }

        function startGame() {
            currentIndex = 0;
            score = 0;
            enteredDigits = [];
            gameActive = true;
            updateScore();
            updateDisplay();
            const input = document.getElementById('digit-input');
            input.value = '';
            input.disabled = false;
            input.focus();
            startTimer();
        }

        function updateDisplay() {
            const display = document.getElementById('digit-display');
            display.innerHTML = '';
            
            for (let i = 0; i <= currentIndex; i++) {
                const digitSpan = document.createElement('span');
                digitSpan.style.display = 'inline-block';
                
                if (i < enteredDigits.length) {
                    digitSpan.textContent = enteredDigits[i];
                    if (enteredDigits[i] === phiDigits[i]) {
                        digitSpan.style.color = '#27ae60';
                    } else {
                        digitSpan.style.color = '#e74c3c';
                        digitSpan.style.textDecoration = 'line-through';
                    }
                } else if (i === currentIndex && gameActive) {
                    digitSpan.textContent = '_';
                    digitSpan.style.color = '#e74c3c';
                    digitSpan.style.fontWeight = 'bold';
                    digitSpan.style.fontSize = '42px';
                    digitSpan.style.borderBottom = '2px solid #3498db';
                    digitSpan.style.paddingBottom = '2px';
                }
                
                if (i > 0 && i % 10 === 0) {
                    digitSpan.style.marginLeft = '15px';
                }
                
                display.appendChild(digitSpan);
            }
        }

        function handleInput(e) {
            if (!gameActive) {
                e.target.value = '';
                return;
            }
            
            const inputDigit = e.target.value;
            
            if (inputDigit.length !== 1) {
                return;
            }
            
            if (!/[0-9]/.test(inputDigit)) {
                e.target.value = '';
                return;
            }
            
            const correctDigit = phiDigits[currentIndex];
            
            if (inputDigit === correctDigit) {
                enteredDigits.push(inputDigit);
                score++;
                currentIndex++;
                updateScore();
                resetTimer();
                e.target.value = '';
                updateDisplay();
                
                if (currentIndex >= phiDigits.length) {
                    gameWin();
                }
            } else {
                enteredDigits.push(inputDigit);
                e.target.value = '';
                updateDisplay();
                gameOver();
            }
        }

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            resetTimer();
            timerInterval = setInterval(updateTimer, 30);
        }

        function resetTimer() {
            const timerProgress = document.getElementById('timer-progress');
            if (timerProgress) {
                timerProgress.style.width = '100%';
            }
        }

        function updateTimer() {
            if (!gameActive) return;
            
            const timer = document.getElementById('timer-progress');
            if (!timer) return;
            
            let currentWidth = parseFloat(timer.style.width);
            if (isNaN(currentWidth)) {
                currentWidth = 100;
            }
            
            if (currentWidth <= 0) {
                gameOver();
                return;
            }
            
            timer.style.width = (currentWidth - 1) + '%';
        }

        function updateScore() {
            const scoreElement = document.getElementById('score');
            if (scoreElement) {
                scoreElement.textContent = score;
            }
        }

        function gameOver() {
            if (!gameActive) return;
            
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            
            const input = document.getElementById('digit-input');
            if (input) {
                input.disabled = true;
            }
            
            setTimeout(() => {
                alert(`Game Over! Final Score: ${score}\nYou memorized ${score} digits of the golden ratio!`);
                startGame();
            }, 100);
        }

        function gameWin() {
            if (!gameActive) return;
            
            gameActive = false;
            clearInterval(timerInterval);
            timerInterval = null;
            
            const input = document.getElementById('digit-input');
            if (input) {
                input.disabled = true;
            }
            
            setTimeout(() => {
                alert(`Congratulations! You've memorized all ${score} digits of the golden ratio!\nYou're a true math genius! 🎉`);
                startGame();
            }, 100);
        }

        document.addEventListener('click', function() {
            const input = document.getElementById('digit-input');
            if (gameActive && input && !input.disabled) {
                input.focus();
            }
        });

        // Start the game when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
